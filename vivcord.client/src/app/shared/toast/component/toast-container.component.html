<div class="notify-container">
  @for (toast of toastService.toasts(); track toast.id) {
    <div 
      class="notify" 
      [class.show]="toast.visible"
      [class.notify-message]="toast.type === 'message'"
      [class.notify-success]="toast.type === 'success'"
      [class.notify-error]="toast.type === 'error'"
      (click)="handleToastClick(toast)"
      role="alert">
      
      @if (toast.avatarUrl) {
        <div class="notify-avatar">
          <img [src]="toast.avatarUrl" alt="Avatar" class="avatar-img-circle" />
        </div>
      } @else if (toast.avatarInitials) {
        <div class="notify-avatar">
          <span>{{ toast.avatarInitials }}</span>
        </div>
      } @else {
        <div class="notify-icon-circle">
          @if (toast.type === 'success') {
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
          } @else if (toast.type === 'error') {
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          } @else {
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          }
        </div>
      }

      <div class="notify-content">
        @if (toast.title) {
          <span class="notify-title">{{ toast.title }}</span>
        }
        <span class="notify-message-text">{{ toast.message }}</span>
      </div>

      <button 
        type="button" 
        class="btn-close-notify" 
        (click)="$event.stopPropagation(); toastService.dismiss(toast.id)"
        title="Dismiss">
        ✕
      </button>
    </div>
  }
</div>
