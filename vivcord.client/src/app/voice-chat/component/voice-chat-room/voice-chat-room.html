<div class="screen-room-container">
  <header class="screen-room-header">
    <div class="header-info">
      <span class="share-title">
        @if (isSharing()) { Your screen }
        @else if (ownerName()) { {{ ownerName() }}'s screen }
        @else { Screen Share }
      </span>
      <span class="call-context">{{ livekitService.activeCallTitle() }}</span>
    </div>
    <div class="header-actions">
      @if (showAudioControls()) {
        <div
          class="screen-audio-control"
          [class.muted]="livekitService.isScreenShareAudioMuted() || livekitService.screenShareAudioVolume() === 0">
          <button
            type="button"
            class="hdr-btn audio-btn"
            (click)="toggleAudioMute()"
            [title]="livekitService.isScreenShareAudioMuted() ? 'Unmute screen audio' : 'Mute screen audio'">
            @if (livekitService.isScreenShareAudioMuted() || livekitService.screenShareAudioVolume() === 0) {
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="2" y1="2" x2="22" y2="22"/>
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                <line x1="22" y1="9" x2="16" y2="15"/>
                <line x1="16" y1="9" x2="22" y2="15"/>
              </svg>
            } @else if (livekitService.screenShareAudioVolume() < 50) {
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
              </svg>
            } @else {
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
              </svg>
            }
          </button>
          <div class="volume-slider-wrapper">
            <div
              #sliderTrack
              class="custom-slider"
              role="slider"
              tabindex="0"
              [attr.aria-valuenow]="effectiveVolume()"
              aria-valuemin="0"
              aria-valuemax="100"
              [title]="'Screen volume: ' + effectiveVolume() + '%'"
              (pointerdown)="onSliderPointerDown($event)"
              (pointermove)="onSliderPointerMove($event)"
              (pointerup)="onSliderPointerUp($event)"
              (pointercancel)="onSliderPointerUp($event)"
              (keydown)="onSliderKeyDown($event)">
              <div class="track-bar">
                <div
                  class="track-fill"
                  [class.snap]="isSnapping()"
                  [style.width.%]="fillPercent()">
                </div>
              </div>
              <div
                class="thumb"
                [class.snap]="isSnapping()"
                [style.left.%]="displayPercent()">
              </div>
            </div>
            <span class="volume-label">{{ effectiveVolume() }}%</span>
          </div>
        </div>
      }
      <button class="hdr-btn" (click)="toggleFullscreen()" title="Fullscreen">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
        </svg>
      </button>
      <button class="hdr-btn close" (click)="close()" title="Back to chat">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="screen-video-area" #videoContainer>
    @if (hasVideo()) {
      <video #screenVideo autoplay playsinline muted></video>
    } @else {
      <div class="no-share-state">
        <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 20h8"/><path d="M12 16v4"/>
        </svg>
        <p>No active screen share</p>
      </div>
    }
  </main>

  @if (isSharing()) {
    <footer class="screen-room-footer">
      <button class="btn-stop-share" (click)="stopSharing()">Stop sharing</button>
    </footer>
  }
</div>
