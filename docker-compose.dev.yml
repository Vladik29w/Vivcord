services:
  # ── Frontend (Angular Dev Server) ──
  frontend:
    build:
      context: ./vivcord.client
      dockerfile: Dockerfile
      target: build
    container_name: vivcord-frontend-dev
    ports:
      - "4200:4200"
    environment:
      - ASPNETCORE_URLS=http://backend:8080
    volumes:
      - ./vivcord.client:/app
      - /app/node_modules
      - /app/.angular
    command: npx ng serve --host 0.0.0.0 --port 4200 --poll 2000
    depends_on:
      - backend
    networks:
      - vivcord-network
    restart: unless-stopped

  # ── Backend (ASP.NET Core Watch) ──
  backend:
    build:
      context: ./Vivcord.Server
      dockerfile: Dockerfile
      target: build
    container_name: vivcord-backend-dev
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=VivcordDb;User Id=sa;Password=Vivcord_Dev_2026!;TrustServerCertificate=True;
      - JwtSetting__Key=CHANGE_ME_dev_super_secret_key_at_least_32_chars!!
      - JwtSetting__VivcordServer=http://localhost:5000
      - JwtSetting__VivcordClient=http://localhost:4200
      - DOTNET_USE_POLLING_FILE_WATCHER=1
    volumes:
      - ./Vivcord.Server:/src
      - /src/bin
      - /src/obj
    command: dotnet watch run --no-launch-profile --urls http://+:8080
    networks:
      - vivcord-network
    restart: unless-stopped

  # ── Database (MSSQL 2025) ──
  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: vivcord-db-dev
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Vivcord_Dev_2026!
    volumes:
      - mssql-data:/var/opt/mssql
    networks:
      - vivcord-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Vivcord_Dev_2026!" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  mssql-data:
    driver: local

networks:
  vivcord-network:
    driver: bridge
