services:
  frontend:
    build:
      target: build
    container_name: vivcord-frontend-dev
    ports:
      - "4200:4200"
    environment:
      - ASPNETCORE_URLS=http://backend:8080
    volumes:
      - ./vivcord.client:/app
      - /app/node_modules
      - /app/.angular
    command: npx ng serve --host 0.0.0.0 --port 4200 --poll 2000
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      target: build
    container_name: vivcord-backend-dev
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=VivcordDb;User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True;
      - JwtSetting__Key=${JWT_SECRET_KEY}
      - JwtSetting__VivcordServer=http://localhost:5000
      - JwtSetting__VivcordClient=http://localhost:4200
    restart: unless-stopped

  #DB
  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: vivcord-db-dev
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_SA_PASSWORD}
    networks:
      - vivcord-network
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${DB_SA_PASSWORD}" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  mssql-data:
    driver: local