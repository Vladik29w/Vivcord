name: Trigger auto deployment for vivcord-app

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - 'Vivcord.Server/**'
    - '.github/workflows/vivcord-app-AutoDeployTrigger-b1f5232d-e193-44b8-89cb-482014e811e9.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.VIVCORDAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.VIVCORDAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.VIVCORDAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/Vivcord.Server
          dockerfilePath: Dockerfile
          _targetLabelKey_: _targetLabel_
          registryUrl: docker.io
          registryUsername: ${{ secrets.VIVCORDAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.VIVCORDAPP_REGISTRY_PASSWORD }}
          containerAppName: vivcord-app
          resourceGroup: Vivcord
          imageToBuild: docker.io/vlad29w/vivcord-backend:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


